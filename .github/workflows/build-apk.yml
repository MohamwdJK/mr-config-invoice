name: Build MR.Config Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Verify Files & Generate Android Shell
        run: |
          echo "Checking existing files..."
          ls -la
          ls -la lib/
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          flutter create --platforms=android --project-name mr_config_invoice --org ir.mrconfig .
          rm -rf lib
          mv lib_backup lib
          mv pubspec_backup.yaml pubspec.yaml

      - name: Download Vazirmatn Persian Fonts
        run: |
          mkdir -p assets/fonts
          curl -L -s -o assets/fonts/Vazirmatn-Regular.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L -s -o assets/fonts/Vazirmatn-Bold.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf
          ls -lh assets/fonts/

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter pub upgrade

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR.Config-Invoice-App
          path: build/app/outputs/flutter-apk/app-release.apk
